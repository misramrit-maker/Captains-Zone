<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Captain — Athlone Cricket Club</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
:root{--accent:#e8c84a;--accent-dark:#b89a20;--bg:#0e1e0e;--surface:#172717;--surface2:#1e341e;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.15);--text:#f0ece0;--muted:#7a9a7a;--dim:#4a6a4a;--red:#e24b4a;--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent);display:flex;align-items:center;gap:8px;flex:1;}
.logo small{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted);font-weight:400;}
.steps{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.step-tab{display:flex;align-items:center;gap:7px;padding:10px 18px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.step-tab:hover{color:var(--text);}
.step-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.step-tab .num{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;}
.step-tab.active .num{background:var(--accent);color:#1a1a00;}
.step-tab.done .num{background:var(--dim);color:var(--text);}
.page{display:none;flex:1;flex-direction:column;}
.page.active{display:flex;}
.squad-wrap{max-width:700px;margin:0 auto;padding:20px 18px;width:100%;}
.squad-wrap h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent);margin-bottom:4px;}
.squad-wrap p{font-size:13px;color:var(--muted);margin-bottom:14px;}
.squad-top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.search-box{flex:1;min-width:160px;font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;}
.search-box:focus{border-color:var(--accent);}
.search-box::placeholder{color:var(--dim);}
.squad-count{font-size:13px;color:var(--muted);white-space:nowrap;}
.squad-count span{color:var(--accent);font-weight:500;}
/* Roster grid */
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-bottom:16px;max-height:calc(100vh - 280px);overflow-y:auto;padding-right:4px;}
.roster-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px 8px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s;user-select:none;}
.roster-card:hover{border-color:var(--border2);background:var(--surface2);}
.roster-card.selected{border-color:var(--accent);background:rgba(232,200,74,0.08);}
.roster-card.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.roster-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;flex-shrink:0;transition:transform .15s;}
.roster-card.selected .roster-avatar{transform:scale(1.1);box-shadow:0 0 0 3px rgba(232,200,74,0.4);}
.roster-name{font-size:11px;text-align:center;color:var(--text);line-height:1.3;word-break:break-word;}
.roster-card.selected .roster-name{color:var(--accent);font-weight:500;}
.roster-badge{width:16px;height:16px;border-radius:50%;background:var(--accent);color:#1a1a00;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.selected-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;min-height:36px;padding:8px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border);}
.sel-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);cursor:pointer;}
.sel-chip:hover{border-color:var(--red);color:var(--red);}
.sel-chip .chip-x{color:var(--dim);font-size:11px;}
.sel-empty{font-size:12px;color:var(--dim);align-self:center;}
.next-btn{font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 24px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;width:100%;transition:all .15s;}
.next-btn:hover{background:var(--accent-dark);color:#fff;}
.next-btn:disabled{opacity:.35;cursor:not-allowed;}
.field-page{display:flex;flex:1;overflow:hidden;}
.field-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--bg);}
#field-svg{width:100%;max-width:min(calc(100vh - 130px),540px);aspect-ratio:1;user-select:none;filter:drop-shadow(0 0 28px rgba(42,122,42,.28));}
.controls{width:224px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);overflow:hidden;}
.ctrl-sec{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ctrl-sec h3{font-size:10px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px;}
.seg{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.seg-btn{font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 0;flex:1;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;}
.seg-btn:hover{background:var(--surface2);color:var(--text);}
.seg-btn.active{background:var(--accent);color:#1a1a00;font-weight:500;}
.apply-btn{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;width:100%;margin-top:9px;transition:all .15s;}
.apply-btn:hover{background:var(--accent-dark);color:#fff;}
.fielder-list{flex:1;overflow-y:auto;padding:10px 14px;}
.fielder-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.fielder-row:last-child{border-bottom:none;}
.f-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;color:#fff;flex-shrink:0;}
.f-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.f-pos{font-size:10px;color:var(--muted);text-align:right;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.save-row{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.save-row input[type=text],.ctrl-sec input[type=text]{font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 9px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;width:100%;}
.save-row input[type=text]:focus,.ctrl-sec input[type=text]:focus{border-color:var(--accent);}
.save-row button{font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;flex-shrink:0;}
.save-row button:hover{background:var(--surface2);}
.saved-tags{padding:6px 14px 8px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0;min-height:34px;}
.saved-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);cursor:pointer;border:1px solid var(--border);}
.saved-tag:hover{border-color:var(--accent);color:var(--accent);}
.tag-x{color:var(--dim);font-size:12px;}
.tag-x:hover{color:var(--red);}
#status-bar{padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.4;flex-shrink:0;min-height:34px;}
.back-link{font-size:12px;color:var(--muted);cursor:pointer;padding:8px 14px;flex-shrink:0;border-top:1px solid var(--border);}
.back-link:hover{color:var(--accent);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@media(max-width:640px){.field-page{flex-direction:column;}.controls{width:100%;border-left:none;border-top:1px solid var(--border);}#field-svg{max-width:100%;}}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="ti ti-ball-cricket" style="font-size:20px;"></i>Field Captain<small>Athlone Cricket Club</small></div>
</header>
<div class="steps">
  <div class="step-tab active" id="tab1" onclick="goStep(1)"><div class="num">1</div>Build Squad</div>
  <div class="step-tab" id="tab2"><div class="num">2</div>Set Field</div>
</div>

<div class="page active" id="page1">
  <div class="squad-wrap">
    <h2>Pick your bowling XI</h2>
    <p>Select up to 11 players from the Athlone CC roster. Tap a card to add, tap again to remove.</p>

    <div class="squad-top">
      <input class="search-box" id="search-box" placeholder="Search player…" oninput="renderRoster()">
      <div class="squad-count">Selected: <span id="sel-count">0</span> / 11</div>
    </div>

    <!-- Selected chips strip -->
    <div class="selected-strip" id="selected-strip">
      <span class="sel-empty">No players selected yet</span>
    </div>

    <!-- Full roster grid -->
    <div class="roster-grid" id="roster-grid"></div>

    <button class="next-btn" id="next-btn" onclick="goStep(2)" disabled>
      Set the field <i class="ti ti-arrow-right" style="vertical-align:-2px;margin-left:4px;"></i>
    </button>
  </div>
</div>

<div class="page" id="page2">
  <div class="field-page">
    <div class="field-panel">
      <svg id="field-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="controls">
      <div class="ctrl-sec">
        <h3>Bowler type</h3>
        <div class="seg">
          <button class="seg-btn active" id="bowl-fast" onclick="setBowl('fast')">Fast</button>
          <button class="seg-btn" id="bowl-spin" onclick="setBowl('spin')">Spin</button>
        </div>
      </div>
      <div class="ctrl-sec">
        <h3>Batsman</h3>
        <div class="seg">
          <button class="seg-btn active" id="bat-rh" onclick="setBat('rh')">Right hand</button>
          <button class="seg-btn" id="bat-lh" onclick="setBat('lh')">Left hand</button>
        </div>
        <button class="apply-btn" onclick="applyDefault()"><i class="ti ti-layout-grid" style="vertical-align:-2px;margin-right:4px;font-size:14px;"></i>Apply default field</button>
      </div>
      <div class="save-row">
        <input type="text" id="save-name" placeholder="Save formation as…">
        <button onclick="saveFormation()" title="Save"><i class="ti ti-device-floppy"></i></button>
      </div>
      <div class="saved-tags" id="saved-tags"></div>
      <div class="fielder-list" id="fielder-list"></div>
      <div id="status-bar">Pick bowler type &amp; batsman, then tap Apply.</div>
      <div class="back-link" onclick="goStep(1)">← Edit squad</div>
    </div>
  </div>
</div>

<script>
const COLORS=['#1D9E75','#378ADD','#D85A30','#7F77DD','#D4537E','#BA7517','#2a9d8f','#e76f51','#264653','#e9c46a','#3a86ff'];
function getColor(id){return COLORS[(id-1)%COLORS.length];}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).join('').substring(0,2).toUpperCase();}

// ─────────────────────────────────────────────────────────────────────────────
// COORDINATE SYSTEM — corrected
// SVG 500×500. Field boundary = circle r=222 from centre (250,250).
// BATSMAN at (250,295) — striker's crease.
// BOWLER delivers from TOP (small y). Batsman faces up.
//
// polar(deg, frac):
//   deg  0   = BEHIND batsman (down SVG, +y direction) → WK / slips / fine leg
//   deg +90  = square OFF side (right of SVG for RH bat)
//   deg -90  = square LEG side (left of SVG for RH bat)
//   deg 180  = IN FRONT / toward bowler (up SVG, −y) → mid-off, long-on etc
//   frac     = fraction of 205px (approx boundary distance from batsman)
//   Result clamped so no fielder lands outside the boundary circle.
// ─────────────────────────────────────────────────────────────────────────────
const BAT={x:250,y:295};
function polar(deg,frac){
  const r=deg*Math.PI/180, d=frac*205;
  let cx=BAT.x+Math.sin(r)*d, cy=BAT.y+Math.cos(r)*d;
  // Clamp to boundary (r=218 gives a small margin inside the painted ellipse)
  const dist=Math.hypot(cx-250,cy-250);
  if(dist>218){const s=218/dist;cx=250+(cx-250)*s;cy=250+(cy-250)*s;}
  return{cx:Math.round(cx),cy:Math.round(cy)};
}

// ALL NAMED POSITIONS for a RIGHT-HAND batsman.
// Verified: none land on the pitch (x=241–259, y=193–308) and all are inside boundary.
const RH={
  // ── BEHIND (deg 0 = down SVG) ────────────────────────────────────────────
  wk:       {...polar(3,   0.15), name:'Wicket Keeper'},  // (252,326) straight behind, close
  slip1:    {...polar(18,  0.24), name:'First Slip'},     // (265,342) off side
  slip2:    {...polar(30,  0.31), name:'Second Slip'},    // (282,350)
  slip3:    {...polar(40,  0.38), name:'Third Slip'},     // (300,355)
  gully:    {...polar(57,  0.34), name:'Gully'},          // (308,333) wide of slips

  // Fine/third man — deep behind, near boundary
  thirdMan: {...polar(28,  0.99), name:'Third Man'},      // (335,451) off side boundary
  fineLeg:  {...polar(-28, 0.99), name:'Fine Leg'},       // (165,451) leg side boundary

  // ── SQUARE (roughly perpendicular to pitch) ───────────────────────────────
  point:    {...polar(98,  0.47), name:'Point'},          // (345,282) off side square
  sqLeg:    {...polar(-98, 0.47), name:'Square Leg'},     // (155,282) leg side square

  // ── IN FRONT (deg 180 = up SVG toward bowler) ────────────────────────────
  coverPt:  {...polar(132, 0.47), name:'Cover Point'},    // (322,231) off 45°
  cover:    {...polar(146, 0.50), name:'Cover'},          // (307,210)
  extraCvr: {...polar(158, 0.52), name:'Extra Cover'},    // (290,196)
  midOff:   {...polar(168, 0.55), name:'Mid Off'},        // (273,185) near straight, off
  midOn:    {...polar(-168,0.55), name:'Mid On'},         // (227,185) near straight, leg
  midWkt:   {...polar(-146,0.50), name:'Mid Wicket'},     // (193,210)
  fwdSqLeg: {...polar(-130,0.46), name:'Forward Sq Leg'},// (178,234)

  // ── CLOSE CATCHERS (beside pitch, not on it) ──────────────────────────────
  shortLeg: {...polar(-125,0.20), name:'Short Leg'},      // (216,271) leg side, beside pitch
  sillyPt:  {...polar(125, 0.18), name:'Silly Point'},    // (280,274) off side, beside pitch
  sillyMid: {...polar(-158,0.16), name:'Silly Mid On'},   // (238,265) in front leg, very close

  // ── DEEP BOUNDARY IN FRONT ───────────────────────────────────────────────
  longOff:  {...polar(172, 0.99), name:'Long Off'},       // (278, 94)
  longOn:   {...polar(-172,0.99), name:'Long On'},        // (222, 94)
  deepCV:   {...polar(146, 0.99), name:'Deep Cover'},     // (363,127)
  deepPt:   {...polar(108, 0.99), name:'Deep Point'},     // (443,232)
  deepMW:   {...polar(-146,0.99), name:'Deep Mid Wicket'},// (137,127)
  deepSL:   {...polar(-108,0.99), name:'Deep Square Leg'},// ( 57,232)
};

// LH batsman: mirror all x coords, swap off/leg position names
const LH_NAME_MAP={
  'Wicket Keeper':'Wicket Keeper',
  'First Slip':'First Slip','Second Slip':'Second Slip','Third Slip':'Third Slip',
  'Gully':'Leg Gully',
  'Point':'Square Leg','Cover Point':'Mid Wicket','Cover':'Mid Wicket',
  'Extra Cover':'Forward Sq Leg','Mid Off':'Mid On',
  'Mid On':'Mid Off','Mid Wicket':'Cover','Square Leg':'Point',
  'Forward Sq Leg':'Extra Cover',
  'Short Leg':'Short Cover','Silly Mid On':'Silly Point','Silly Point':'Silly Mid On',
  'Third Man':'Fine Leg','Fine Leg':'Third Man',
  'Long Off':'Long On','Long On':'Long Off',
  'Deep Cover':'Deep Mid Wicket','Deep Point':'Deep Square Leg',
  'Deep Mid Wicket':'Deep Cover','Deep Square Leg':'Deep Point',
};
const LH=Object.fromEntries(Object.entries(RH).map(([k,v])=>[k,{cx:500-v.cx,cy:v.cy,name:LH_NAME_MAP[v.name]||v.name}]));
function getPOS(h){return h==='rh'?RH:LH;}

// ─────────────────────────────────────────────────────────────────────────────
// DEFAULT FIELD PLACEMENTS (verified: no pitch collisions, realistic spacing)
// ─────────────────────────────────────────────────────────────────────────────
const DEFAULTS={
  fast:{
    // Classic seam/swing attack: WK back, 2 slips, gully, point, cover, mid-off, mid-on, sq-leg, fine leg, third man
    rh:['wk','slip1','slip2','gully','point','cover','midOff','midOn','sqLeg','fineLeg','thirdMan'],
    lh:['wk','slip1','slip2','gully','point','cover','midOff','midOn','sqLeg','fineLeg','thirdMan'],
  },
  spin:{
    // Spin attack: WK up, slip, silly point, short leg, cover, mid-off, mid-on, mid-wicket, sq-leg, fine leg, third man
    rh:['wk','slip1','sillyPt','shortLeg','cover','midOff','midOn','midWkt','sqLeg','fineLeg','thirdMan'],
    lh:['wk','slip1','sillyMid','shortLeg','cover','midOff','midOn','midWkt','sqLeg','fineLeg','thirdMan'],
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// GUIDE LABELS — positions painted on the grass for reference
// Using same polar() so they stay consistent with fielder coordinates
// ─────────────────────────────────────────────────────────────────────────────
const GUIDES=[
  {rh:'Fine Leg',   a:-28, f:0.72},
  {rh:'Third Man',  a:28,  f:0.72},
  {rh:'Sq Leg',     a:-98, f:0.55},
  {rh:'Point',      a:98,  f:0.55},
  {rh:'Mid Wicket', a:-146,f:0.60},
  {rh:'Cover',      a:146, f:0.60},
  {rh:'Mid On',     a:-168,f:0.60},
  {rh:'Mid Off',    a:168, f:0.60},
  {rh:'Long On',    a:-172,f:0.85},
  {rh:'Long Off',   a:172, f:0.85},
  {rh:'Gully',      a:57,  f:0.26},
];
const GUIDE_LH_NAME={
  'Fine Leg':'Third Man','Third Man':'Fine Leg',
  'Sq Leg':'Point','Point':'Sq Leg',
  'Mid Wicket':'Cover','Cover':'Mid Wicket',
  'Mid On':'Mid Off','Mid Off':'Mid On',
  'Long On':'Long Off','Long Off':'Long On',
  'Gully':'Leg Gully',
};

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const svg=document.getElementById('field-svg');
let players=[],fielders={},formations={},nextId=1;
let bowlType='fast',batHand='rh';
let selected=null,dragging=null,dragOffset={x:0,y:0};

function persist(){try{localStorage.setItem('fc5_p',JSON.stringify(players));localStorage.setItem('fc5_f',JSON.stringify(fielders));localStorage.setItem('fc5_fm',JSON.stringify(formations));}catch(e){}}
function loadData(){
  try{
    const p=localStorage.getItem('fc5_p');if(p){players=JSON.parse(p);nextId=Math.max(0,...players.map(x=>x.id))+1;}
    const f=localStorage.getItem('fc5_f');if(f)fielders=JSON.parse(f);
    const fm=localStorage.getItem('fc5_fm');if(fm)formations=JSON.parse(fm);
  }catch(e){}
}

function goStep(n){
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n-1));
  document.querySelectorAll('.step-tab').forEach((t,i)=>{t.classList.toggle('active',i===n-1);t.classList.toggle('done',i<n-1);});
  if(n===2){buildField();renderFielders();renderFielderList();renderSavedTags();}
}

// ── ATHLONE CC ROSTER ─────────────────────────────────────────────────────────
const ROSTER=[
  'Amrit','Keith','Saqib','Sushant','Naveenkumar','Taha','Karan','Vignesh',
  'Yash','Himanshu','Vibin','Supriya','Rhys','Nikhil','Akshay','Priyesh',
  'Santhosh','Avanish','Paras','Syed Ahtisham','Indraneel','Gaurav',
  'Naveenrohith','Manu','Arjun','Amal','Hriday','Garva','Mashal','Anjan',
  'Surya','Bhargav','Sujeet','Rakesh','Eldhose','Deepan','Sandita','Rupin',
  'Poonam','Deepti','Vaishali','Renee','Ridhi','Chandana','Nikita','Penny',
  'Nethra','Sunitha','Lalitha','Gopi','Priyanka','Salim','Ragul','Harsh',
  'Danyal','Jawwad','Edward','Chetan','Sid','Kapila',
].map((name,i)=>({id:i+1,name}));

// selected = Set of roster IDs in the XI
let selected11=new Set();

function toggleRoster(id){
  if(selected11.has(id)){selected11.delete(id);}
  else{if(selected11.size>=11)return;selected11.add(id);}
  // Sync players array from selection (preserve order added)
  syncPlayers();
  renderRoster();
  renderSelectedStrip();
  updateSelCount();
}

function syncPlayers(){
  // Build ordered players from selected11, preserving existing order
  const existing=players.map(p=>p.id);
  // Add newly selected (not yet in players)
  selected11.forEach(id=>{
    if(!existing.includes(id)){
      const r=ROSTER.find(x=>x.id===id);
      if(r) players.push({id:r.id,name:r.name});
    }
  });
  // Remove deselected
  players=players.filter(p=>selected11.has(p.id));
  // Reassign display nextId (not used for roster but keep consistent)
  nextId=ROSTER.length+1;
  persist();
}

function renderRoster(){
  const q=(document.getElementById('search-box').value||'').toLowerCase().trim();
  const grid=document.getElementById('roster-grid');grid.innerHTML='';
  const filtered=ROSTER.filter(r=>!q||r.name.toLowerCase().includes(q));
  filtered.forEach(r=>{
    const isSel=selected11.has(r.id);
    const isDisabled=!isSel&&selected11.size>=11;
    const card=document.createElement('div');
    card.className='roster-card'+(isSel?' selected':'')+(isDisabled?' disabled':'');
    const col=getColor(r.id);
    const pos=isSel?([...selected11].indexOf(r.id)+1):null;
    card.innerHTML=`
      <div class="roster-avatar" style="background:${col}">${isSel&&pos?'<span style="font-size:11px;font-weight:700">'+pos+'</span>':initials(r.name)}</div>
      <div class="roster-name">${r.name}</div>
      ${isSel?'<div class="roster-badge">✓</div>':''}
    `;
    if(!isDisabled) card.addEventListener('click',()=>toggleRoster(r.id));
    grid.appendChild(card);
  });
  if(filtered.length===0) grid.innerHTML='<div style="grid-column:1/-1;font-size:13px;color:var(--dim);padding:16px 0;">No players match your search.</div>';
}

function renderSelectedStrip(){
  const strip=document.getElementById('selected-strip');strip.innerHTML='';
  if(selected11.size===0){strip.innerHTML='<span class="sel-empty">No players selected yet</span>';return;}
  players.forEach((p,i)=>{
    const chip=document.createElement('span');chip.className='sel-chip';
    chip.innerHTML=`<span style="background:${getColor(p.id)};width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:600">${i+1}</span>${p.name}<span class="chip-x">✕</span>`;
    chip.addEventListener('click',()=>toggleRoster(p.id));
    strip.appendChild(chip);
  });
}

function updateSelCount(){
  document.getElementById('sel-count').textContent=selected11.size;
  document.getElementById('next-btn').disabled=selected11.size<1;
}

// Restore selection from saved players on load
function restoreSelection(){
  selected11=new Set(players.map(p=>p.id));
  renderRoster();renderSelectedStrip();updateSelCount();
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function setBowl(v){bowlType=v;document.getElementById('bowl-fast').classList.toggle('active',v==='fast');document.getElementById('bowl-spin').classList.toggle('active',v==='spin');}
function setBat(v){batHand=v;document.getElementById('bat-rh').classList.toggle('active',v==='rh');document.getElementById('bat-lh').classList.toggle('active',v==='lh');buildField();renderFielders();renderFielderList();}

function applyDefault(){
  if(!players.length){setStatus('Add players first.');return;}
  const keys=DEFAULTS[bowlType][batHand];
  const POS=getPOS(batHand);
  const nf={};
  players.forEach((p,i)=>{const k=keys[i];if(k&&POS[k])nf[p.id]={x:POS[k].cx,y:POS[k].cy};});
  fielders=nf;persist();renderFielders();renderFielderList();
  setStatus('✓ '+(bowlType==='fast'?'Fast':'Spin')+' field vs '+(batHand==='rh'?'RH':'LH')+' bat applied. Drag to fine-tune.');
}

// ── SVG BUILD ─────────────────────────────────────────────────────────────────
function mksvg(tag,attrs,text){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(text!==undefined)e.textContent=text;return e;
}

function buildField(){
  svg.innerHTML='';

  // Outfield mow stripes
  svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:222,ry:222,fill:'#1b5e1b',stroke:'#3d8f3d','stroke-width':'2'}));
  for(let i=0;i<8;i++){const r=222-i*27;if(r<1)break;svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:r,ry:r,fill:'none',stroke:i%2?'#1a5c1a':'#1f681f','stroke-width':'27'}));}

  // 30-yard restriction circle (radius ~95px in our SVG scale)
  svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:96,ry:96,fill:'none',stroke:'rgba(255,255,255,0.2)','stroke-width':'1.5','stroke-dasharray':'7,5'}));

  // Off/leg side faint dividing line
  svg.appendChild(mksvg('line',{x1:250,y1:30,x2:250,y2:470,stroke:'rgba(255,255,255,0.05)','stroke-width':'1','stroke-dasharray':'4,8'}));

  // Off / leg labels
  const offX=batHand==='rh'?422:78,legX=batHand==='rh'?78:422;
  svg.appendChild(mksvg('text',{x:offX,y:254,'font-size':'8',fill:'rgba(255,255,255,.14)','text-anchor':'middle','font-family':'DM Sans,sans-serif','font-style':'italic'},'off side'));
  svg.appendChild(mksvg('text',{x:legX,y:254,'font-size':'8',fill:'rgba(255,255,255,.14)','text-anchor':'middle','font-family':'DM Sans,sans-serif','font-style':'italic'},'leg side'));

  // ── PITCH ──────────────────────────────────────────────────────────────────
  // Pitch runs from bowler end (top, y≈193) to batsman crease (y≈295)
  // Batsman faces UP (toward bowler). Behind batsman = DOWN (higher y).
  svg.appendChild(mksvg('rect',{x:242,y:193,width:16,height:102,rx:2,fill:'#c8a96e',stroke:'#a88848','stroke-width':'1.5'}));
  // Creases
  const BAT_CREASE_Y=295, BOWL_CREASE_Y=207;
  svg.appendChild(mksvg('line',{x1:236,x2:264,y1:BAT_CREASE_Y,y2:BAT_CREASE_Y,stroke:'rgba(255,255,255,.65)','stroke-width':'1.5'}));
  svg.appendChild(mksvg('line',{x1:236,x2:264,y1:BOWL_CREASE_Y,y2:BOWL_CREASE_Y,stroke:'rgba(255,255,255,.65)','stroke-width':'1.5'}));
  // Stumps at both ends
  [{y:193},{y:295}].forEach(({y})=>{
    [-3,0,3].forEach(dx=>svg.appendChild(mksvg('rect',{x:250+dx-1,y:y-9,width:2,height:18,fill:'#f5e6c8',rx:1})));
    svg.appendChild(mksvg('line',{x1:244,x2:256,y1:y-9,y2:y-9,stroke:'#f5e6c8','stroke-width':'1.5'}));
  });
  // Batsman marker dot on striker's crease
  svg.appendChild(mksvg('circle',{cx:250,cy:BAT.y,r:3,fill:'rgba(255,255,255,0.45)',stroke:'#a88848','stroke-width':'1'}));
  // Bowling end label (top of SVG)
  svg.appendChild(mksvg('text',{x:250,y:164,'font-size':'8',fill:'rgba(255,255,255,.18)','text-anchor':'middle','font-family':'DM Sans,sans-serif'},'▼ bowling end'));

  // ── GUIDE LABELS on the grass ──────────────────────────────────────────────
  // Each label gets a dark semi-transparent pill background so it reads clearly on green
  GUIDES.forEach(({rh:rhLabel,a,f})=>{
    const ang=batHand==='lh'?-a:a;
    const txt=batHand==='lh'?(GUIDE_LH_NAME[rhLabel]||rhLabel):rhLabel;
    const p=polar(ang,f);
    // Skip if on or very near the pitch
    if(Math.abs(p.cx-250)<20&&p.cy>185&&p.cy<315)return;
    // Skip if outside boundary
    if(Math.hypot(p.cx-250,p.cy-250)>215)return;

    const pw=txt.length*4.8+10, ph=12;
    svg.appendChild(mksvg('rect',{
      x:p.cx-pw/2, y:p.cy-ph+2,
      width:pw, height:ph, rx:'4',
      fill:'rgba(0,0,0,0.55)',
    }));
    svg.appendChild(mksvg('text',{
      x:p.cx, y:p.cy,
      'font-size':'7.5', fill:'rgba(255,255,255,0.85)',
      'text-anchor':'middle', 'font-family':'DM Sans,sans-serif', 'font-weight':'500',
    },txt));
  });

  // Fielder group (always last = on top)
  svg.appendChild(mksvg('g',{id:'fl'}));
  // mousedown on SVG for click-to-deselect and mouse drag
  svg.addEventListener('mousedown',onMD);
  // touchstart is attached per-fielder in renderFielders() for instant drag without scroll
}

// ── RENDER FIELDERS — 3D professional player figures ──────────────────────────
function ensureDefs(){
  let defs=svg.querySelector('defs');
  if(defs) return defs;
  defs=mksvg('defs');
  svg.insertBefore(defs,svg.firstChild);
  return defs;
}

function ensurePlayerGradients(color,id){
  const defs=ensureDefs();
  const gid='pg'+id, sid='ps'+id, kid='pk'+id;
  if(defs.querySelector('#'+gid)) return;

  // Lighten colour for highlight
  function lighten(hex,amt){
    let c=parseInt(hex.replace('#',''),16);
    let r=Math.min(255,((c>>16)&255)+amt);
    let g=Math.min(255,((c>>8)&255)+amt);
    let b=Math.min(255,(c&255)+amt);
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function darken(hex,amt){return lighten(hex,-amt);}
  const light=lighten(color,70), dark=darken(color,40);

  // Jersey radial gradient (3D sphere-like)
  const jerseyGrad=mksvg('radialGradient',{id:gid,cx:'38%',cy:'30%',r:'65%','fx':'38%','fy':'30%'});
  jerseyGrad.appendChild(mksvg('stop',{'offset':'0%','stop-color':light,'stop-opacity':'1'}));
  jerseyGrad.appendChild(mksvg('stop',{'offset':'55%','stop-color':color,'stop-opacity':'1'}));
  jerseyGrad.appendChild(mksvg('stop',{'offset':'100%','stop-color':dark,'stop-opacity':'1'}));
  defs.appendChild(jerseyGrad);

  // Head radial gradient (skin tone shaded)
  const headGrad=mksvg('radialGradient',{id:sid,cx:'40%',cy:'32%',r:'60%'});
  headGrad.appendChild(mksvg('stop',{'offset':'0%','stop-color':'#f5d5b0'}));
  headGrad.appendChild(mksvg('stop',{'offset':'100%','stop-color':'#c8955a'}));
  defs.appendChild(headGrad);

  // Helmet gradient (white helmet)
  const helmGrad=mksvg('radialGradient',{id:kid,cx:'35%',cy:'28%',r:'65%'});
  helmGrad.appendChild(mksvg('stop',{'offset':'0%','stop-color':'#ffffff'}));
  helmGrad.appendChild(mksvg('stop',{'offset':'100%','stop-color':'#aaaaaa'}));
  defs.appendChild(helmGrad);
}

function ensureSharedDefs(){
  const defs=ensureDefs();
  if(defs.querySelector('#dropshadow')) return;

  // Drop shadow filter
  const filter=mksvg('filter',{id:'dropshadow',x:'-30%',y:'-20%',width:'160%',height:'160%'});
  const fe1=mksvg('feDropShadow',{dx:'0',dy:'3',stdDeviation:'2.5','flood-color':'rgba(0,0,0,0.55)','flood-opacity':'1'});
  filter.appendChild(fe1);
  defs.appendChild(filter);

  // Selection glow filter
  const glow=mksvg('filter',{id:'selglow',x:'-40%',y:'-40%',width:'180%',height:'180%'});
  const feBlur=mksvg('feGaussianBlur',{in:'SourceGraphic',stdDeviation:'3',result:'blur'});
  const feMerge=mksvg('feMerge');
  const n1=mksvg('feMergeNode',{in:'blur'});
  const n2=mksvg('feMergeNode',{in:'SourceGraphic'});
  feMerge.appendChild(n1); feMerge.appendChild(n2);
  glow.appendChild(feBlur); glow.appendChild(feMerge);
  defs.appendChild(glow);
}

function renderFielders(){
  const layer=svg.getElementById('fl');if(!layer)return;layer.innerHTML='';
  ensureSharedDefs();

  Object.entries(fielders).forEach(([pid,pos])=>{
    pid=parseInt(pid);
    const p=players.find(x=>x.id===pid);if(!p)return;
    const color=getColor(pid), isSel=selected===pid, isDrag=dragging===pid;

    ensurePlayerGradients(color,pid);
    const gid='pg'+pid, sid='ps'+pid, kid='pk'+pid;

    const g=mksvg('g',{
      'class':'fielder','data-id':pid,
      cursor:isDrag?'grabbing':'grab',
      transform:`translate(${pos.x},${pos.y})`,
      filter:'url(#dropshadow)',
    });

    // ── Ground shadow (oval under feet)
    g.appendChild(mksvg('ellipse',{cx:'0',cy:'14',rx:'11',ry:'4',fill:'rgba(0,0,0,0.35)'}));

    // ── Selection ring (pulsing dashed gold halo)
    if(isSel){
      const halo=mksvg('circle',{r:'22',fill:'none',stroke:'#e8c84a','stroke-width':'2.5','stroke-dasharray':'5,3'});
      g.appendChild(halo);
    }

    // ── BODY / JERSEY
    // Torso: rounded rectangle shape via path
    // Body from y=2 to y=14, width ~14
    g.appendChild(mksvg('path',{
      d:'M -7,2 Q -8,-2 0,-3 Q 8,-2 7,2 L 8,14 Q 0,16 -8,14 Z',
      fill:`url(#${gid})`,
      stroke:'rgba(0,0,0,0.3)','stroke-width':'0.5'
    }));

    // Jersey number / kit stripe (horizontal stripe on chest)
    g.appendChild(mksvg('line',{x1:'-7',y1:'4',x2:'7',y2:'4',stroke:'rgba(255,255,255,0.25)','stroke-width':'1.2'}));

    // Arms (left and right)
    g.appendChild(mksvg('path',{d:'M -7,3 Q -12,6 -10,11',stroke:`url(#${gid})`,'stroke-width':'4','stroke-linecap':'round',fill:'none'}));
    g.appendChild(mksvg('path',{d:'M 7,3 Q 12,6 10,11',stroke:`url(#${gid})`,'stroke-width':'4','stroke-linecap':'round',fill:'none'}));

    // Gloves / hands (small circles at arm ends)
    g.appendChild(mksvg('circle',{cx:'-10',cy:'11',r:'2.5',fill:'#f5d5b0',stroke:'rgba(0,0,0,.25)','stroke-width':'0.5'}));
    g.appendChild(mksvg('circle',{cx:'10',cy:'11',r:'2.5',fill:'#f5d5b0',stroke:'rgba(0,0,0,.25)','stroke-width':'0.5'}));

    // Legs
    g.appendChild(mksvg('path',{d:'M -3,13 L -4,19 L -2,19',stroke:'#ffffff','stroke-width':'3.5','stroke-linecap':'round','stroke-linejoin':'round',fill:'none','stroke-opacity':'0.9'}));
    g.appendChild(mksvg('path',{d:'M 3,13 L 4,19 L 2,19',stroke:'#ffffff','stroke-width':'3.5','stroke-linecap':'round','stroke-linejoin':'round',fill:'none','stroke-opacity':'0.9'}));

    // ── NECK
    g.appendChild(mksvg('rect',{x:'-2.5',y:'-6',width:'5',height:'5',rx:'1',fill:'#c8955a'}));

    // ── HEAD (face)
    g.appendChild(mksvg('circle',{cx:'0',cy:'-11',r:'7.5',fill:`url(#${sid})`,stroke:'rgba(0,0,0,0.3)','stroke-width':'0.5'}));

    // ── HELMET
    // Dome
    g.appendChild(mksvg('path',{
      d:'M -7,-11 Q -7,-21 0,-22 Q 7,-21 7,-11 Z',
      fill:`url(#${kid})`,stroke:'rgba(0,0,0,0.3)','stroke-width':'0.5'
    }));
    // Visor / peak (small rectangle jutting out from front)
    const vx=color; // visor matches jersey colour
    g.appendChild(mksvg('rect',{x:'-8',y:'-14',width:'16',height:'3',rx:'1',fill:`url(#${gid})`,stroke:'rgba(0,0,0,0.2)','stroke-width':'0.4'}));
    // Helmet grill lines (face guard)
    g.appendChild(mksvg('line',{x1:'-5',y1:'-11',x2:'-5',y2:'-7',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));
    g.appendChild(mksvg('line',{x1:'-3',y1:'-12',x2:'-3',y2:'-7',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));
    g.appendChild(mksvg('line',{x1:'-1',y1:'-12',x2:'-1',y2:'-7',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));
    g.appendChild(mksvg('line',{x1:'1',y1:'-12',x2:'1',y2:'-7',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));
    g.appendChild(mksvg('line',{x1:'3',y1:'-12',x2:'3',y2:'-7',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));
    g.appendChild(mksvg('line',{x1:'5',y1:'-11',x2:'5',y2:'-7',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));
    // Horizontal bar across grill
    g.appendChild(mksvg('line',{x1:'-5',y1:'-9',x2:'5',y2:'-9',stroke:'rgba(0,0,0,0.35)','stroke-width':'0.8'}));

    // ── NAME LABEL below figure
    const sn=p.name.split(' ')[0]; // first name only
    const label=mksvg('text',{'text-anchor':'middle',y:'28','font-size':'7','font-weight':'500',fill:'rgba(255,255,255,0.92)','font-family':'DM Sans,sans-serif','paint-order':'stroke','stroke':'rgba(0,0,0,0.7)','stroke-width':'2.5','stroke-linejoin':'round'});
    label.textContent=sn.length>9?sn.substring(0,8)+'…':sn;
    g.appendChild(label);

    // Touch drag
    g.addEventListener('touchstart',onTS,{passive:false});
    layer.appendChild(g);
  });
}

function nearestPosName(fx,fy){
  const allPos=Object.values(getPOS(batHand));
  return allPos.reduce((a,b)=>Math.hypot(a.cx-fx,a.cy-fy)<Math.hypot(b.cx-fx,b.cy-fy)?a:b).name;
}

function renderFielderList(){
  const list=document.getElementById('fielder-list');list.innerHTML='';
  players.forEach(p=>{
    const fd=fielders[p.id];
    const row=document.createElement('div');row.className='fielder-row';
    row.innerHTML=`<div class="f-dot" style="background:${getColor(p.id)}">${initials(p.name)}</div><span class="f-name">${p.name}</span><span class="f-pos">${fd?nearestPosName(fd.x,fd.y):'—'}</span>`;
    list.appendChild(row);
  });
}

// ── DRAG — pick up and move immediately, no pre-selection needed ───────────────
function svgPt(e){
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const sx=vb.width/r.width,sy=vb.height/r.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};
}

// Mouse
function onMD(e){
  const g=e.target.closest('.fielder');
  if(g){
    e.preventDefault();
    e.stopPropagation();
    startDrag(g,svgPt(e));
    window.addEventListener('mousemove',onMM);
    window.addEventListener('mouseup',onMU);
  }else{
    selected=null;renderFielders();
  }
}

// Touch — attached directly to each fielder element so no hit-test needed
function onTS(e){
  // e.currentTarget is the fielder <g> element
  e.preventDefault();
  e.stopPropagation();
  startDrag(e.currentTarget, svgPt(e));
  window.addEventListener('touchmove',onTM,{passive:false});
  window.addEventListener('touchend',onTE);
}

function startDrag(g,pt){
  dragging=parseInt(g.getAttribute('data-id'));
  selected=dragging;
  const pos=fielders[dragging];
  dragOffset={x:pos.x-pt.x,y:pos.y-pt.y};
  // Show grabbing cursor immediately
  g.setAttribute('cursor','grabbing');
  renderFielders();
  setStatus('Moving '+players.find(p=>p.id===dragging)?.name+'…');
}

function onMM(e){if(dragging)moveDrag(svgPt(e));}
function onTM(e){e.preventDefault();if(dragging)moveDrag(svgPt(e));}

function moveDrag(pt){
  if(!dragging)return;
  let nx=pt.x+dragOffset.x,ny=pt.y+dragOffset.y;
  // Clamp inside boundary
  const dx=nx-250,dy=ny-250,dist=Math.hypot(dx,dy);
  if(dist>218){nx=250+dx/dist*218;ny=250+dy/dist*218;}
  fielders[dragging]={x:Math.round(nx),y:Math.round(ny)};
  renderFielders();
}

function onMU(){endDrag();window.removeEventListener('mousemove',onMM);window.removeEventListener('mouseup',onMU);}
function onTE(){endDrag();window.removeEventListener('touchmove',onTM);window.removeEventListener('touchend',onTE);}

function endDrag(){
  if(!dragging)return;
  const pos=fielders[dragging];
  const allPos=Object.values(getPOS(batHand));
  const snap=allPos.reduce((a,b)=>Math.hypot(a.cx-pos.x,a.cy-pos.y)<Math.hypot(b.cx-pos.x,b.cy-pos.y)?a:b);
  if(Math.hypot(snap.cx-pos.x,snap.cy-pos.y)<28){
    fielders[dragging]={x:snap.cx,y:snap.cy};
    setStatus(players.find(p=>p.id===dragging)?.name+' → '+snap.name);
  }else{
    setStatus(players.find(p=>p.id===dragging)?.name+' repositioned.');
  }
  dragging=null;
  persist();renderFielders();renderFielderList();
}

// ── FORMATIONS ────────────────────────────────────────────────────────────────
function saveFormation(){
  const name=document.getElementById('save-name').value.trim();
  if(!name){setStatus('Enter a name to save.');return;}
  formations[name]=JSON.parse(JSON.stringify(fielders));document.getElementById('save-name').value='';
  persist();renderSavedTags();setStatus('"'+name+'" saved.');
}
function loadFormation(name){if(!formations[name])return;fielders=JSON.parse(JSON.stringify(formations[name]));persist();renderFielders();renderFielderList();setStatus('"'+name+'" loaded.');}
function deleteFormation(name){delete formations[name];persist();renderSavedTags();}
function renderSavedTags(){
  const wrap=document.getElementById('saved-tags');wrap.innerHTML='';
  const keys=Object.keys(formations);
  if(!keys.length){wrap.innerHTML='<span style="font-size:11px;color:var(--dim);">No saved formations.</span>';return;}
  keys.forEach(name=>{
    const tag=document.createElement('span');tag.className='saved-tag';
    tag.innerHTML=name+' <span class="tag-x" onclick="event.stopPropagation();deleteFormation(\''+name+'\')">✕</span>';
    tag.addEventListener('click',()=>loadFormation(name));wrap.appendChild(tag);
  });
}
function setStatus(msg){document.getElementById('status-bar').textContent=msg;}

loadData();restoreSelection();
</script>
