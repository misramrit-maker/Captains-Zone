<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Captain — Athlone Cricket Club</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
:root{--accent:#e8c84a;--accent-dark:#b89a20;--bg:#0e1e0e;--surface:#172717;--surface2:#1e341e;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.15);--text:#f0ece0;--muted:#7a9a7a;--dim:#4a6a4a;--red:#e24b4a;--r:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent);display:flex;align-items:center;gap:8px;flex:1;}
.logo small{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted);font-weight:400;}
.steps{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.step-tab{display:flex;align-items:center;gap:7px;padding:10px 18px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.step-tab:hover{color:var(--text);}
.step-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.step-tab .num{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;}
.step-tab.active .num{background:var(--accent);color:#1a1a00;}
.step-tab.done .num{background:var(--dim);color:var(--text);}
.page{display:none;flex:1;flex-direction:column;}
.page.active{display:flex;}
.squad-wrap{max-width:540px;margin:0 auto;padding:24px 18px;width:100%;}
.squad-wrap h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent);margin-bottom:4px;}
.squad-wrap p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.player-input-row{display:flex;gap:8px;margin-bottom:10px;}
input[type=text]{font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;width:100%;}
input[type=text]:focus{border-color:var(--accent);}
input[type=text]::placeholder{color:var(--dim);}
.add-btn{font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-btn:hover{background:var(--accent-dark);color:#fff;}
.squad-count{font-size:12px;color:var(--muted);margin-bottom:10px;}
.squad-count span{color:var(--accent);font-weight:500;}
.squad-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.squad-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);}
.squad-num{font-size:12px;color:var(--dim);width:18px;text-align:right;flex-shrink:0;}
.squad-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;flex-shrink:0;}
.squad-name{flex:1;font-size:14px;}
.squad-del{background:none;border:none;cursor:pointer;color:var(--dim);font-size:16px;padding:2px 5px;border-radius:4px;}
.squad-del:hover{color:var(--red);}
.next-btn{font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 24px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;width:100%;transition:all .15s;}
.next-btn:hover{background:var(--accent-dark);color:#fff;}
.next-btn:disabled{opacity:.35;cursor:not-allowed;}
.field-page{display:flex;flex:1;overflow:hidden;}
.field-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--bg);}
#field-svg{width:100%;max-width:min(calc(100vh - 130px),540px);aspect-ratio:1;user-select:none;filter:drop-shadow(0 0 28px rgba(42,122,42,.28));}
.controls{width:224px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);overflow:hidden;}
.ctrl-sec{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ctrl-sec h3{font-size:10px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px;}
.seg{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.seg-btn{font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 0;flex:1;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;}
.seg-btn:hover{background:var(--surface2);color:var(--text);}
.seg-btn.active{background:var(--accent);color:#1a1a00;font-weight:500;}
.apply-btn{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;width:100%;margin-top:9px;transition:all .15s;}
.apply-btn:hover{background:var(--accent-dark);color:#fff;}
.fielder-list{flex:1;overflow-y:auto;padding:10px 14px;}
.fielder-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.fielder-row:last-child{border-bottom:none;}
.f-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;color:#fff;flex-shrink:0;}
.f-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.f-pos{font-size:10px;color:var(--muted);text-align:right;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.save-row{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.save-row input{flex:1;min-width:0;font-size:12px;padding:6px 9px;}
.save-row button{font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;flex-shrink:0;}
.save-row button:hover{background:var(--surface2);}
.saved-tags{padding:6px 14px 8px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0;min-height:34px;}
.saved-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);cursor:pointer;border:1px solid var(--border);}
.saved-tag:hover{border-color:var(--accent);color:var(--accent);}
.tag-x{color:var(--dim);font-size:12px;}
.tag-x:hover{color:var(--red);}
#status-bar{padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.4;flex-shrink:0;min-height:34px;}
.back-link{font-size:12px;color:var(--muted);cursor:pointer;padding:8px 14px;flex-shrink:0;border-top:1px solid var(--border);}
.back-link:hover{color:var(--accent);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@media(max-width:640px){.field-page{flex-direction:column;}.controls{width:100%;border-left:none;border-top:1px solid var(--border);}#field-svg{max-width:100%;}}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="ti ti-ball-cricket" style="font-size:20px;"></i>Field Captain<small>Athlone Cricket Club</small></div>
</header>
<div class="steps">
  <div class="step-tab active" id="tab1" onclick="goStep(1)"><div class="num">1</div>Build Squad</div>
  <div class="step-tab" id="tab2"><div class="num">2</div>Set Field</div>
</div>

<div class="page active" id="page1">
  <div class="squad-wrap">
    <h2>Your bowling squad</h2>
    <p>Add up to 11 players. Press Enter or click Add.</p>
    <div class="player-input-row">
      <input type="text" id="player-input" placeholder="Player name…" maxlength="24">
      <button class="add-btn" onclick="addPlayer()"><i class="ti ti-plus" style="vertical-align:-2px;"></i> Add</button>
    </div>
    <div class="squad-count">Players: <span id="count">0</span> / 11</div>
    <div class="squad-list" id="squad-list"></div>
    <button class="next-btn" id="next-btn" onclick="goStep(2)" disabled>Set the field <i class="ti ti-arrow-right" style="vertical-align:-2px;margin-left:4px;"></i></button>
  </div>
</div>

<div class="page" id="page2">
  <div class="field-page">
    <div class="field-panel">
      <svg id="field-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="controls">
      <div class="ctrl-sec">
        <h3>Bowler type</h3>
        <div class="seg">
          <button class="seg-btn active" id="bowl-fast" onclick="setBowl('fast')">Fast</button>
          <button class="seg-btn" id="bowl-spin" onclick="setBowl('spin')">Spin</button>
        </div>
      </div>
      <div class="ctrl-sec">
        <h3>Batsman</h3>
        <div class="seg">
          <button class="seg-btn active" id="bat-rh" onclick="setBat('rh')">Right hand</button>
          <button class="seg-btn" id="bat-lh" onclick="setBat('lh')">Left hand</button>
        </div>
        <button class="apply-btn" onclick="applyDefault()"><i class="ti ti-layout-grid" style="vertical-align:-2px;margin-right:4px;font-size:14px;"></i>Apply default field</button>
      </div>
      <div class="save-row">
        <input type="text" id="save-name" placeholder="Save formation as…">
        <button onclick="saveFormation()" title="Save"><i class="ti ti-device-floppy"></i></button>
      </div>
      <div class="saved-tags" id="saved-tags"></div>
      <div class="fielder-list" id="fielder-list"></div>
      <div id="status-bar">Pick bowler type &amp; batsman, then tap Apply.</div>
      <div class="back-link" onclick="goStep(1)">← Edit squad</div>
    </div>
  </div>
</div>

<script>
const COLORS=['#1D9E75','#378ADD','#D85A30','#7F77DD','#D4537E','#BA7517','#2a9d8f','#e76f51','#264653','#e9c46a','#3a86ff'];
function getColor(id){return COLORS[(id-1)%COLORS.length];}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).join('').substring(0,2).toUpperCase();}

// ─────────────────────────────────────────────────────────────────────────────
// COORDINATE SYSTEM
// SVG 500×500. Field boundary ≈ radius 222 from centre (250,250).
// BATSMAN at (250, 300) — striker's crease.
// BOWLER runs in from TOP of SVG (y decreases = toward bowler).
//
// polar(angleDeg, distFrac):
//   angleDeg 0   = straight behind batsman (up the SVG, toward fine leg/3rd man zone)
//   angleDeg +90 = square OFF side  (right of SVG for RH batsman)
//   angleDeg -90 = square LEG side  (left of SVG for RH batsman)
//   angleDeg 180 = straight in FRONT (down the SVG, long-on/long-off direction)
//   distFrac     = fraction of 212 (boundary distance from batsman)
// ─────────────────────────────────────────────────────────────────────────────
const BAT={x:250,y:300};
function polar(deg,frac){
  const r=deg*Math.PI/180,d=frac*212;
  return{cx:Math.round(BAT.x+Math.sin(r)*d),cy:Math.round(BAT.y-Math.cos(r)*d)};
}

// ALL POSITIONS — defined for RIGHT-HAND batsman
// Off side = positive angle (right of SVG). Leg side = negative angle (left).
const RH={
  // ── BEHIND WICKET (slips arc, off side) ──────────────────────────────────
  wk:       {...polar(5,   0.12), name:'Wicket Keeper'},   // just off-side, close
  slip1:    {...polar(17,  0.15), name:'First Slip'},
  slip2:    {...polar(27,  0.19), name:'Second Slip'},
  slip3:    {...polar(36,  0.23), name:'Third Slip'},
  gully:    {...polar(52,  0.24), name:'Gully'},           // squarer, wider than slip

  // ── IN FRONT — OFF SIDE ──────────────────────────────────────────────────
  // Square = 90°, cover = ~55°, extra cover = ~40°, mid-off = ~20° from straight
  point:    {...polar(90,  0.47), name:'Point'},
  coverPt:  {...polar(68,  0.50), name:'Cover Point'},
  cover:    {...polar(54,  0.52), name:'Cover'},
  extraCvr: {...polar(40,  0.53), name:'Extra Cover'},
  midOff:   {...polar(22,  0.53), name:'Mid Off'},

  // ── IN FRONT — LEG SIDE ──────────────────────────────────────────────────
  midOn:    {...polar(-22, 0.53), name:'Mid On'},
  midWkt:   {...polar(-54, 0.52), name:'Mid Wicket'},
  sqLeg:    {...polar(-90, 0.47), name:'Square Leg'},
  fwdSqLeg: {...polar(-68, 0.44), name:'Forward Sq Leg'},

  // ── CLOSE CATCHERS ────────────────────────────────────────────────────────
  shortLeg: {...polar(-50, 0.18), name:'Short Leg'},       // leg side, bat-pad
  sillyMid: {...polar(-26, 0.14), name:'Silly Mid On'},    // very close, leg side
  sillyPt:  {...polar(50,  0.16), name:'Silly Point'},     // very close, off side

  // ── BOUNDARY — BEHIND WICKET ─────────────────────────────────────────────
  // Third man: fine behind, off side boundary (~20°)
  // Fine leg: fine behind, leg side boundary (~-20°)
  // These are near boundary but NOT at straight — they're in the fine region
  thirdMan: {...polar(22,  0.93), name:'Third Man'},
  fineLeg:  {...polar(-22, 0.93), name:'Fine Leg'},

  // ── BOUNDARY — IN FRONT ──────────────────────────────────────────────────
  // Long off/on: ~15-20° off straight, at boundary
  longOff:  {...polar(17,  0.95), name:'Long Off'},
  longOn:   {...polar(-17, 0.95), name:'Long On'},
  deepCV:   {...polar(58,  0.93), name:'Deep Cover'},
  deepPt:   {...polar(85,  0.91), name:'Deep Point'},
  deepMW:   {...polar(-58, 0.93), name:'Deep Mid Wicket'},
  deepSL:   {...polar(-85, 0.91), name:'Deep Square Leg'},
};

// Build LH positions: mirror x (500-cx), swap off/leg labels
const LH_NAME_MAP={
  'Wicket Keeper':'Wicket Keeper',
  'First Slip':'First Slip','Second Slip':'Second Slip','Third Slip':'Third Slip',
  'Gully':'Leg Gully',
  'Point':'Square Leg','Cover Point':'Mid Wicket','Cover':'Mid Wicket',
  'Extra Cover':'Forward Sq Leg','Mid Off':'Mid On',
  'Mid On':'Mid Off','Mid Wicket':'Cover','Square Leg':'Point',
  'Forward Sq Leg':'Extra Cover',
  'Short Leg':'Short Cover','Silly Mid On':'Silly Point','Silly Point':'Silly Mid On',
  'Third Man':'Fine Leg','Fine Leg':'Third Man',
  'Long Off':'Long On','Long On':'Long Off',
  'Deep Cover':'Deep Mid Wicket','Deep Point':'Deep Square Leg',
  'Deep Mid Wicket':'Deep Cover','Deep Square Leg':'Deep Point',
};
const LH=Object.fromEntries(Object.entries(RH).map(([k,v])=>[k,{cx:500-v.cx,cy:v.cy,name:LH_NAME_MAP[v.name]||v.name}]));
function getPOS(h){return h==='rh'?RH:LH;}

// ─────────────────────────────────────────────────────────────────────────────
// DEFAULT FIELD PLACEMENTS
// Order: player index → position key
// Player 0 = WK (always), then 9 fielders + 1 bowler (bowler is just another fielder)
// ─────────────────────────────────────────────────────────────────────────────
const DEFAULTS={
  fast:{
    // Classic seam attack for RH bat:
    // WK back, 2 slips, gully, point, cover, mid-off, mid-on, fine leg, third man, sq-leg
    rh:['wk','slip1','slip2','gully','point','cover','midOff','midOn','sqLeg','fineLeg','thirdMan'],
    // For LH bat the slips/gully still go to the new off side (mirrored automatically)
    lh:['wk','slip1','slip2','gully','point','cover','midOff','midOn','sqLeg','fineLeg','thirdMan'],
  },
  spin:{
    // Spin attack for RH bat:
    // WK up close, slip, silly point, short leg, cover, mid-off, mid-on, mid-wicket, sq-leg, fine leg, 3rd man
    rh:['wk','slip1','sillyPt','shortLeg','cover','midOff','midOn','midWkt','sqLeg','fineLeg','thirdMan'],
    // Spin vs LH bat: slip to new off side, silly mid-on (now off side for LH), short leg
    lh:['wk','slip1','sillyMid','shortLeg','cover','midOff','midOn','midWkt','sqLeg','fineLeg','thirdMan'],
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// GUIDE LABELS painted on the field grass (faint, for reference)
// Defined as polar coords relative to batsman, mirrored for LH
// ─────────────────────────────────────────────────────────────────────────────
const GUIDES=[
  // Behind wicket
  {rh:'Third Man',  a:26,  f:0.72},{rh:'Fine Leg',   a:-26, f:0.72},
  // Square
  {rh:'Point',      a:90,  f:0.55},{rh:'Square Leg', a:-90, f:0.55},
  // 45° off
  {rh:'Cover',      a:55,  f:0.62},{rh:'Mid Wicket', a:-55, f:0.62},
  // Straight
  {rh:'Mid Off',    a:24,  f:0.62},{rh:'Mid On',     a:-24, f:0.62},
  // Deep straight
  {rh:'Long Off',   a:20,  f:0.84},{rh:'Long On',    a:-20, f:0.84},
  // Deep square
  {rh:'Deep Point', a:86,  f:0.86},{rh:'Deep S. Leg',a:-86, f:0.86},
  // Close catchers region (label only, no fielder always here)
  {rh:'Gully',      a:54,  f:0.28},
];
const GUIDE_LH_NAME={
  'Third Man':'Fine Leg','Fine Leg':'Third Man',
  'Point':'Square Leg','Square Leg':'Point',
  'Cover':'Mid Wicket','Mid Wicket':'Cover',
  'Mid Off':'Mid On','Mid On':'Mid Off',
  'Long Off':'Long On','Long On':'Long Off',
  'Deep Point':'Deep S. Leg','Deep S. Leg':'Deep Point',
  'Gully':'Leg Gully',
};

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const svg=document.getElementById('field-svg');
let players=[],fielders={},formations={},nextId=1;
let bowlType='fast',batHand='rh';
let selected=null,dragging=null,dragOffset={x:0,y:0};

function persist(){try{localStorage.setItem('fc5_p',JSON.stringify(players));localStorage.setItem('fc5_f',JSON.stringify(fielders));localStorage.setItem('fc5_fm',JSON.stringify(formations));}catch(e){}}
function loadData(){
  try{
    const p=localStorage.getItem('fc5_p');if(p){players=JSON.parse(p);nextId=Math.max(0,...players.map(x=>x.id))+1;}
    const f=localStorage.getItem('fc5_f');if(f)fielders=JSON.parse(f);
    const fm=localStorage.getItem('fc5_fm');if(fm)formations=JSON.parse(fm);
  }catch(e){}
}

function goStep(n){
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n-1));
  document.querySelectorAll('.step-tab').forEach((t,i)=>{t.classList.toggle('active',i===n-1);t.classList.toggle('done',i<n-1);});
  if(n===2){buildField();renderFielders();renderFielderList();renderSavedTags();}
}

// ── SQUAD ─────────────────────────────────────────────────────────────────────
function addPlayer(){
  const inp=document.getElementById('player-input'),name=inp.value.trim();if(!name)return;
  if(players.length>=11){setStatus('Squad full — 11 players max.');return;}
  players.push({id:nextId++,name});inp.value='';inp.focus();persist();renderSquad();
}
function removePlayer(id){players=players.filter(p=>p.id!==id);delete fielders[id];persist();renderSquad();}
function renderSquad(){
  const list=document.getElementById('squad-list');list.innerHTML='';
  players.forEach((p,i)=>{
    const row=document.createElement('div');row.className='squad-item';
    row.innerHTML=`<span class="squad-num">${i+1}</span><div class="squad-avatar" style="background:${getColor(p.id)}">${initials(p.name)}</div><span class="squad-name">${p.name}</span><button class="squad-del" onclick="removePlayer(${p.id})" title="Remove"><i class="ti ti-x"></i></button>`;
    list.appendChild(row);
  });
  document.getElementById('count').textContent=players.length;
  document.getElementById('next-btn').disabled=players.length<1;
}
document.getElementById('player-input').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer();});

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function setBowl(v){bowlType=v;document.getElementById('bowl-fast').classList.toggle('active',v==='fast');document.getElementById('bowl-spin').classList.toggle('active',v==='spin');}
function setBat(v){batHand=v;document.getElementById('bat-rh').classList.toggle('active',v==='rh');document.getElementById('bat-lh').classList.toggle('active',v==='lh');buildField();renderFielders();renderFielderList();}

function applyDefault(){
  if(!players.length){setStatus('Add players first.');return;}
  const keys=DEFAULTS[bowlType][batHand];
  const POS=getPOS(batHand);
  const nf={};
  players.forEach((p,i)=>{const k=keys[i];if(k&&POS[k])nf[p.id]={x:POS[k].cx,y:POS[k].cy};});
  fielders=nf;persist();renderFielders();renderFielderList();
  setStatus('✓ '+(bowlType==='fast'?'Fast':'Spin')+' field vs '+(batHand==='rh'?'RH':'LH')+' bat applied. Drag to fine-tune.');
}

// ── SVG BUILD ─────────────────────────────────────────────────────────────────
function mksvg(tag,attrs,text){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(text!==undefined)e.textContent=text;return e;
}

function buildField(){
  svg.innerHTML='';

  // Outfield mow stripes
  svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:222,ry:222,fill:'#1b5e1b',stroke:'#3d8f3d','stroke-width':'2'}));
  for(let i=0;i<8;i++){const r=222-i*27;if(r<1)break;svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:r,ry:r,fill:'none',stroke:i%2?'#1a5c1a':'#1f681f','stroke-width':'27'}));}

  // 30-yard restriction circle (radius ~95px in our SVG scale)
  svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:96,ry:96,fill:'none',stroke:'rgba(255,255,255,0.2)','stroke-width':'1.5','stroke-dasharray':'7,5'}));

  // Off/leg side faint dividing line
  svg.appendChild(mksvg('line',{x1:250,y1:30,x2:250,y2:470,stroke:'rgba(255,255,255,0.05)','stroke-width':'1','stroke-dasharray':'4,8'}));

  // Off / leg labels
  const offX=batHand==='rh'?422:78,legX=batHand==='rh'?78:422;
  svg.appendChild(mksvg('text',{x:offX,y:254,'font-size':'8',fill:'rgba(255,255,255,.14)','text-anchor':'middle','font-family':'DM Sans,sans-serif','font-style':'italic'},'off side'));
  svg.appendChild(mksvg('text',{x:legX,y:254,'font-size':'8',fill:'rgba(255,255,255,.14)','text-anchor':'middle','font-family':'DM Sans,sans-serif','font-style':'italic'},'leg side'));

  // ── PITCH ──────────────────────────────────────────────────────────────────
  // 22 yards long. Our field radius ≈ 70m → pitch half = 10m → 10/70×222≈32px each side of centre
  // So pitch from y=218 to y=282? Actually batsman crease at y=300, bowler end at y≈193.
  // Let's use real look: pitch rect from y=193 to y=300 (batsman crease), with buffer above
  svg.appendChild(mksvg('rect',{x:242,y:193,width:16,height:107,rx:2,fill:'#c8a96e',stroke:'#a88848','stroke-width':'1.5'}));

  // Popping crease at batsman end (y=300) and bowling end (y=207 approx)
  const BOWL_CREASE_Y=207,BAT_CREASE_Y=300;
  svg.appendChild(mksvg('line',{x1:236,x2:264,y1:BAT_CREASE_Y,y2:BAT_CREASE_Y,stroke:'rgba(255,255,255,.65)','stroke-width':'1.5'}));
  svg.appendChild(mksvg('line',{x1:236,x2:264,y1:BOWL_CREASE_Y,y2:BOWL_CREASE_Y,stroke:'rgba(255,255,255,.65)','stroke-width':'1.5'}));

  // Stumps at both ends
  const STUMP_SETS=[{y:193,bails:true},{y:300,bails:false}];
  STUMP_SETS.forEach(({y,bails})=>{
    [-3,0,3].forEach(dx=>svg.appendChild(mksvg('rect',{x:250+dx-1,y:y-9,width:2,height:18,fill:'#f5e6c8',rx:1})));
    if(bails)svg.appendChild(mksvg('line',{x1:244,x2:256,y1:y-9,y2:y-9,stroke:'#f5e6c8','stroke-width':'1.5'}));
  });

  // Batsman marker (small dot on striker's crease)
  svg.appendChild(mksvg('circle',{cx:250,cy:BAT.y,r:3,fill:'rgba(255,255,255,0.5)',stroke:'#a88848','stroke-width':'1'}));

  // Bowling end direction
  svg.appendChild(mksvg('text',{x:250,y:164,'font-size':'8',fill:'rgba(255,255,255,.16)','text-anchor':'middle','font-family':'DM Sans,sans-serif'},'▼ bowling end'));

  // ── GUIDE LABELS on the grass ──────────────────────────────────────────────
  GUIDES.forEach(({rh:rhLabel,a,f})=>{
    const ang=batHand==='lh'?-a:a;
    const txt=batHand==='lh'?(GUIDE_LH_NAME[rhLabel]||rhLabel):rhLabel;
    const p=polar(ang,f);
    // Skip if label lands on the pitch area
    if(Math.abs(p.cx-250)<18&&p.cy>185&&p.cy<310)return;
    // Skip if outside boundary
    if(Math.hypot(p.cx-250,p.cy-250)>210)return;
    svg.appendChild(mksvg('text',{x:p.cx,y:p.cy,'font-size':'7.5',fill:'rgba(255,255,255,.17)','text-anchor':'middle','font-family':'DM Sans,sans-serif'},txt));
  });

  // Fielder group (always last = on top)
  svg.appendChild(mksvg('g',{id:'fl'}));
  svg.addEventListener('mousedown',onMD);
  svg.addEventListener('touchstart',onTS,{passive:false});
}

// ── RENDER FIELDERS ───────────────────────────────────────────────────────────
function renderFielders(){
  const layer=svg.getElementById('fl');if(!layer)return;layer.innerHTML='';
  Object.entries(fielders).forEach(([pid,pos])=>{
    pid=parseInt(pid);const p=players.find(x=>x.id===pid);if(!p)return;
    const color=getColor(pid),isSel=selected===pid;
    const g=mksvg('g',{'class':'fielder','data-id':pid,cursor:'grab',transform:`translate(${pos.x},${pos.y})`});
    if(isSel)g.appendChild(mksvg('circle',{r:'19',fill:'none',stroke:'#e8c84a','stroke-width':'2','stroke-dasharray':'4,3'}));
    g.appendChild(mksvg('circle',{r:'14',fill:color,stroke:'rgba(0,0,0,.4)','stroke-width':'1.5'}));
    g.appendChild(mksvg('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':'8.5','font-weight':'500',fill:'rgba(255,255,255,.95)','font-family':'DM Sans,sans-serif'},initials(p.name)));
    const sn=p.name.length>10?p.name.substring(0,9)+'…':p.name;
    g.appendChild(mksvg('text',{'text-anchor':'middle',y:'24','font-size':'7.5',fill:'rgba(255,255,255,.85)','font-family':'DM Sans,sans-serif'},sn));
    layer.appendChild(g);
  });
}

function nearestPosName(fx,fy){
  const allPos=Object.values(getPOS(batHand));
  return allPos.reduce((a,b)=>Math.hypot(a.cx-fx,a.cy-fy)<Math.hypot(b.cx-fx,b.cy-fy)?a:b).name;
}

function renderFielderList(){
  const list=document.getElementById('fielder-list');list.innerHTML='';
  players.forEach(p=>{
    const fd=fielders[p.id];
    const row=document.createElement('div');row.className='fielder-row';
    row.innerHTML=`<div class="f-dot" style="background:${getColor(p.id)}">${initials(p.name)}</div><span class="f-name">${p.name}</span><span class="f-pos">${fd?nearestPosName(fd.x,fd.y):'—'}</span>`;
    list.appendChild(row);
  });
}

// ── DRAG ──────────────────────────────────────────────────────────────────────
function svgPt(e){
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const sx=vb.width/r.width,sy=vb.height/r.height;
  const cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;
  return{x:(cx-r.left)*sx,y:(cy-r.top)*sy};
}
function onMD(e){const g=e.target.closest('.fielder');if(g){e.preventDefault();startDrag(g,svgPt(e));window.addEventListener('mousemove',onMM);window.addEventListener('mouseup',onMU);}else{selected=null;renderFielders();}}
function onTS(e){const g=e.target.closest('.fielder');if(g){e.preventDefault();startDrag(g,svgPt(e));window.addEventListener('touchmove',onTM,{passive:false});window.addEventListener('touchend',onTE);}}
function startDrag(g,pt){dragging=parseInt(g.getAttribute('data-id'));selected=dragging;const pos=fielders[dragging];dragOffset={x:pos.x-pt.x,y:pos.y-pt.y};renderFielders();setStatus('Moving '+players.find(p=>p.id===dragging)?.name+'…');}
function onMM(e){if(dragging)moveDrag(svgPt(e));}
function onTM(e){e.preventDefault();if(dragging)moveDrag(svgPt(e));}
function moveDrag(pt){
  if(!dragging)return;
  let nx=pt.x+dragOffset.x,ny=pt.y+dragOffset.y;
  const dx=nx-250,dy=ny-250,dist=Math.hypot(dx,dy);
  if(dist>218){nx=250+dx/dist*218;ny=250+dy/dist*218;}
  fielders[dragging]={x:Math.round(nx),y:Math.round(ny)};renderFielders();
}
function onMU(){endDrag();window.removeEventListener('mousemove',onMM);window.removeEventListener('mouseup',onMU);}
function onTE(){endDrag();window.removeEventListener('touchmove',onTM);window.removeEventListener('touchend',onTE);}
function endDrag(){
  if(!dragging)return;
  const pos=fielders[dragging];
  const allPos=Object.values(getPOS(batHand));
  const snap=allPos.reduce((a,b)=>Math.hypot(a.cx-pos.x,a.cy-pos.y)<Math.hypot(b.cx-pos.x,b.cy-pos.y)?a:b);
  if(Math.hypot(snap.cx-pos.x,snap.cy-pos.y)<28){
    fielders[dragging]={x:snap.cx,y:snap.cy};
    setStatus(players.find(p=>p.id===dragging)?.name+' → '+snap.name);
  }else setStatus(players.find(p=>p.id===dragging)?.name+' repositioned.');
  dragging=null;persist();renderFielders();renderFielderList();
}

// ── FORMATIONS ────────────────────────────────────────────────────────────────
function saveFormation(){
  const name=document.getElementById('save-name').value.trim();
  if(!name){setStatus('Enter a name to save.');return;}
  formations[name]=JSON.parse(JSON.stringify(fielders));document.getElementById('save-name').value='';
  persist();renderSavedTags();setStatus('"'+name+'" saved.');
}
function loadFormation(name){if(!formations[name])return;fielders=JSON.parse(JSON.stringify(formations[name]));persist();renderFielders();renderFielderList();setStatus('"'+name+'" loaded.');}
function deleteFormation(name){delete formations[name];persist();renderSavedTags();}
function renderSavedTags(){
  const wrap=document.getElementById('saved-tags');wrap.innerHTML='';
  const keys=Object.keys(formations);
  if(!keys.length){wrap.innerHTML='<span style="font-size:11px;color:var(--dim);">No saved formations.</span>';return;}
  keys.forEach(name=>{
    const tag=document.createElement('span');tag.className='saved-tag';
    tag.innerHTML=name+' <span class="tag-x" onclick="event.stopPropagation();deleteFormation(\''+name+'\')">✕</span>';
    tag.addEventListener('click',()=>loadFormation(name));wrap.appendChild(tag);
  });
}
function setStatus(msg){document.getElementById('status-bar').textContent=msg;}

loadData();renderSquad();
</script>
