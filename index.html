<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Captain — Athlone Cricket Club</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
:root {
  --accent:#e8c84a; --accent-dark:#b89a20;
  --bg:#0e1e0e; --surface:#172717; --surface2:#1e341e;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.15);
  --text:#f0ece0; --muted:#7a9a7a; --dim:#4a6a4a;
  --red:#e24b4a; --fast:#EF9F27; --spin:#AFA9EC;
  --r:8px; --rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent);display:flex;align-items:center;gap:8px;flex:1;}
.logo small{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted);font-weight:400;}

/* ── STEP NAV ── */
.steps{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.step-tab{display:flex;align-items:center;gap:7px;padding:10px 18px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.step-tab:hover{color:var(--text);}
.step-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.step-tab .num{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;}
.step-tab.active .num{background:var(--accent);color:#1a1a00;}
.step-tab.done .num{background:var(--dim);color:var(--text);}

/* ── PAGES ── */
.page{display:none;flex:1;flex-direction:column;}
.page.active{display:flex;}

/* ── SQUAD PAGE ── */
.squad-wrap{max-width:560px;margin:0 auto;padding:24px 18px;width:100%;}
.squad-wrap h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent);margin-bottom:4px;}
.squad-wrap p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.player-input-row{display:flex;gap:8px;margin-bottom:10px;}
input[type=text]{font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;width:100%;}
input[type=text]:focus{border-color:var(--accent);}
input[type=text]::placeholder{color:var(--dim);}
.add-btn{font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-btn:hover{background:var(--accent-dark);color:#fff;}
.squad-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.squad-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);}
.squad-num{font-size:12px;color:var(--dim);width:18px;text-align:right;flex-shrink:0;}
.squad-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;flex-shrink:0;}
.squad-name{flex:1;font-size:14px;}
.squad-del{background:none;border:none;cursor:pointer;color:var(--dim);font-size:16px;padding:2px 4px;border-radius:4px;}
.squad-del:hover{color:var(--red);}
.squad-count{font-size:12px;color:var(--muted);margin-bottom:12px;}
.squad-count span{color:var(--accent);font-weight:500;}
.next-btn{font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 24px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;width:100%;transition:all .15s;}
.next-btn:hover{background:var(--accent-dark);color:#fff;}
.next-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ── FIELD PAGE ── */
.field-page{display:flex;flex:1;overflow:hidden;}
.field-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;background:var(--bg);}
#field-svg{width:100%;max-width:min(calc(100vh - 140px),540px);aspect-ratio:1;user-select:none;filter:drop-shadow(0 0 32px rgba(42,122,42,.3));}
.controls{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);}
.ctrl-section{padding:14px;border-bottom:1px solid var(--border);}
.ctrl-section h3{font-size:10px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
.seg{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;width:100%;}
.seg-btn{font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 0;flex:1;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;}
.seg-btn:hover{background:var(--surface2);color:var(--text);}
.seg-btn.active{background:var(--accent);color:#1a1a00;font-weight:500;}
.apply-btn{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px;border-radius:var(--r);border:1px solid var(--accent-dark);background:var(--accent);color:#1a1a00;font-weight:500;cursor:pointer;width:100%;margin-top:10px;transition:all .15s;}
.apply-btn:hover{background:var(--accent-dark);color:#fff;}
.fielder-list{flex:1;overflow-y:auto;padding:10px 14px;}
.fielder-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.fielder-row:last-child{border-bottom:none;}
.f-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;color:#fff;flex-shrink:0;}
.f-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.f-pos{font-size:10px;color:var(--muted);text-align:right;flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#status-bar{padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.4;flex-shrink:0;}
.back-link{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;padding:10px 14px;flex-shrink:0;}
.back-link:hover{color:var(--accent);}

/* ── SAVE ROW ── */
.save-row{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);}
.save-row input{flex:1;min-width:0;font-size:12px;padding:6px 9px;}
.save-row button{font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;}
.save-row button:hover{background:var(--surface2);}
.saved-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);cursor:pointer;border:1px solid var(--border);margin:2px;}
.saved-tag:hover{border-color:var(--accent);color:var(--accent);}
.saved-tag .x{color:var(--dim);margin-left:2px;}
.saved-tag .x:hover{color:var(--red);}
.saved-tags{padding:6px 14px;display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@media(max-width:640px){.field-page{flex-direction:column;}.controls{width:100%;border-left:none;border-top:1px solid var(--border);}#field-svg{max-width:100%;}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <i class="ti ti-ball-cricket" style="font-size:20px;"></i>
    Field Captain
    <small>Athlone Cricket Club</small>
  </div>
</header>

<div class="steps">
  <div class="step-tab active" id="tab1" onclick="goStep(1)">
    <div class="num">1</div> Build Squad
  </div>
  <div class="step-tab" id="tab2">
    <div class="num">2</div> Set Field
  </div>
</div>

<!-- ══ STEP 1: SQUAD ══════════════════════════════════════════════════════════ -->
<div class="page active" id="page1">
  <div class="squad-wrap">
    <h2>Your bowling squad</h2>
    <p>Add all 11 players. You can edit or remove them any time.</p>
    <div class="player-input-row">
      <input type="text" id="player-input" placeholder="Enter player name…" maxlength="24">
      <button class="add-btn" onclick="addPlayer()"><i class="ti ti-plus" style="vertical-align:-2px;"></i> Add</button>
    </div>
    <div class="squad-count">Players added: <span id="count">0</span> / 11</div>
    <div class="squad-list" id="squad-list"></div>
    <button class="next-btn" id="next-btn" onclick="goStep(2)" disabled>
      Set the field <i class="ti ti-arrow-right" style="vertical-align:-2px;margin-left:4px;"></i>
    </button>
  </div>
</div>

<!-- ══ STEP 2: FIELD ══════════════════════════════════════════════════════════ -->
<div class="page" id="page2">
  <div class="field-page">

    <div class="field-panel">
      <svg id="field-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="controls">
      <div class="ctrl-section">
        <h3>Bowler type</h3>
        <div class="seg">
          <button class="seg-btn active" id="bowl-fast" onclick="setBowl('fast')">Fast</button>
          <button class="seg-btn" id="bowl-spin" onclick="setBowl('spin')">Spin</button>
        </div>
      </div>
      <div class="ctrl-section">
        <h3>Batsman</h3>
        <div class="seg">
          <button class="seg-btn active" id="bat-rh" onclick="setBat('rh')">Right hand</button>
          <button class="seg-btn" id="bat-lh" onclick="setBat('lh')">Left hand</button>
        </div>
        <button class="apply-btn" onclick="applyDefault()">
          <i class="ti ti-layout-grid" style="vertical-align:-2px;margin-right:4px;font-size:14px;"></i>Apply default field
        </button>
      </div>

      <div class="save-row">
        <input type="text" id="save-name" placeholder="Save as…">
        <button onclick="saveFormation()"><i class="ti ti-device-floppy"></i></button>
      </div>
      <div class="saved-tags" id="saved-tags"></div>

      <div class="fielder-list" id="fielder-list"></div>

      <div id="status-bar">Select bowler type &amp; batsman, then tap Apply.</div>
      <div class="back-link" onclick="goStep(1)">← Edit squad</div>
    </div>

  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const COLORS=['#1D9E75','#378ADD','#D85A30','#7F77DD','#D4537E','#BA7517','#2a9d8f','#e76f51','#264653','#e9c46a','#a8dadc'];

// All named field positions (for RH batsman, bowler at top)
const POS={
  wk:      {name:'Wicket Keeper',cx:250,cy:228},
  slip1:   {name:'First Slip',cx:278,cy:216},
  slip2:   {name:'Second Slip',cx:300,cy:205},
  slip3:   {name:'Third Slip',cx:320,cy:195},
  gully:   {name:'Gully',cx:316,cy:196},
  point:   {name:'Point',cx:350,cy:252},
  coverPt: {name:'Cover Point',cx:336,cy:296},
  cover:   {name:'Cover',cx:320,cy:322},
  midOff:  {name:'Mid Off',cx:284,cy:360},
  midOn:   {name:'Mid On',cx:214,cy:360},
  midWkt:  {name:'Mid Wicket',cx:178,cy:320},
  sqLeg:   {name:'Square Leg',cx:158,cy:264},
  fineLeg: {name:'Fine Leg',cx:188,cy:178},
  thirdMan:{name:'Third Man',cx:318,cy:164},
  sillyPt: {name:'Silly Point',cx:274,cy:290},
  sillyMid:{name:'Silly Mid On',cx:226,cy:290},
  shortLeg:{name:'Short Leg',cx:218,cy:256},
  fwdSqLeg:{name:'Forward Sq Leg',cx:172,cy:296},
  longOn:  {name:'Long On',cx:192,cy:430},
  longOff: {name:'Long Off',cx:320,cy:425},
  deepMW:  {name:'Deep Mid Wicket',cx:148,cy:382},
  deepSL:  {name:'Deep Square Leg',cx:124,cy:262},
  deepFL:  {name:'Deep Fine Leg',cx:168,cy:128},
  deepTM:  {name:'Deep Third Man',cx:346,cy:128},
  deepCV:  {name:'Deep Cover',cx:388,cy:302},
  deepPt:  {name:'Deep Point',cx:396,cy:220},
};

// Default fields: positions in order, first N players fill them
// [bowlerType][batHand] → array of posKey
const DEFAULTS={
  fast:{
    rh:['wk','slip1','slip2','gully','point','coverPt','midOff','midOn','fineLeg','thirdMan','sqLeg'],
    lh:['wk','slip1','slip2','gully','point','cover','midOff','midOn','sqLeg','fineLeg','thirdMan']
  },
  spin:{
    rh:['wk','slip1','sillyPt','shortLeg','cover','midOff','midOn','midWkt','sqLeg','fineLeg','thirdMan'],
    lh:['wk','slip1','sillyMid','shortLeg','cover','midOff','midOn','midWkt','sqLeg','fineLeg','thirdMan']
  }
};

const svg=document.getElementById('field-svg');
let players=[],fielders={},formations={};
let bowlType='fast',batHand='rh';
let selected=null,dragging=null,dragOffset={x:0,y:0};
let nextId=1;

// ── PERSIST ───────────────────────────────────────────────────────────────────
function save(){try{localStorage.setItem('fc_p',JSON.stringify(players));localStorage.setItem('fc_f',JSON.stringify(fielders));localStorage.setItem('fc_fm',JSON.stringify(formations));}catch(e){}}
function loadData(){
  try{
    const p=localStorage.getItem('fc_p');if(p){players=JSON.parse(p);nextId=Math.max(...players.map(x=>x.id),0)+1;}
    const f=localStorage.getItem('fc_f');if(f)fielders=JSON.parse(f);
    const fm=localStorage.getItem('fc_fm');if(fm)formations=JSON.parse(fm);
  }catch(e){}
}

// ── STEP NAV ──────────────────────────────────────────────────────────────────
function goStep(n){
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n-1));
  document.querySelectorAll('.step-tab').forEach((t,i)=>{
    t.classList.toggle('active',i===n-1);
    if(i<n-1)t.classList.add('done');else t.classList.remove('done');
  });
  if(n===2){initField();renderFielders();renderFielderList();renderSavedTags();}
}

// ── SQUAD PAGE ────────────────────────────────────────────────────────────────
function getColor(id){return COLORS[(id-1)%COLORS.length];}
function initials(name){return name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();}

function addPlayer(){
  const inp=document.getElementById('player-input');
  const name=inp.value.trim();
  if(!name)return;
  if(players.length>=11){setStatus('Squad is full — max 11 players.');return;}
  players.push({id:nextId++,name});
  inp.value='';
  inp.focus();
  save();renderSquad();
}

function removePlayer(id){
  players=players.filter(p=>p.id!==id);
  delete fielders[id];
  save();renderSquad();
}

function renderSquad(){
  const list=document.getElementById('squad-list');
  list.innerHTML='';
  players.forEach((p,i)=>{
    const row=document.createElement('div');row.className='squad-item';
    row.innerHTML=`
      <span class="squad-num">${i+1}</span>
      <div class="squad-avatar" style="background:${getColor(p.id)}">${initials(p.name)}</div>
      <span class="squad-name">${p.name}</span>
      <button class="squad-del" onclick="removePlayer(${p.id})" title="Remove"><i class="ti ti-x"></i></button>
    `;
    list.appendChild(row);
  });
  document.getElementById('count').textContent=players.length;
  document.getElementById('next-btn').disabled=players.length<1;
}

document.getElementById('player-input').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer();});

// ── FIELD PAGE CONTROLS ───────────────────────────────────────────────────────
function setBowl(v){
  bowlType=v;
  document.getElementById('bowl-fast').classList.toggle('active',v==='fast');
  document.getElementById('bowl-spin').classList.toggle('active',v==='spin');
}
function setBat(v){
  batHand=v;
  document.getElementById('bat-rh').classList.toggle('active',v==='rh');
  document.getElementById('bat-lh').classList.toggle('active',v==='lh');
}

function applyDefault(){
  if(!players.length){setStatus('Add players in Step 1 first.');return;}
  const positions=DEFAULTS[bowlType][batHand];
  const newFielders={};
  players.forEach((p,i)=>{
    const posKey=positions[i];
    if(!posKey)return;
    let pos=POS[posKey];
    if(!pos)return;
    // Mirror x for LH batsman
    const cx=batHand==='lh'?500-pos.cx:pos.cx;
    newFielders[p.id]={x:cx,y:pos.cy,posName:pos.name};
  });
  fielders=newFielders;
  save();renderFielders();renderFielderList();
  const bLabel=bowlType==='fast'?'fast bowler':'spin bowler';
  const batLabel=batHand==='rh'?'right-hand':'left-hand';
  setStatus('Default field set for '+bLabel+' vs '+batLabel+' bat. Drag to adjust.');
}

// ── FIELD SVG ─────────────────────────────────────────────────────────────────
function mksvg(tag,attrs,text){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(text!==undefined)e.textContent=text;
  return e;
}

function initField(){
  svg.innerHTML='';
  // Outfield
  svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:234,ry:234,fill:'#1d5c1d',stroke:'#3a8a3a','stroke-width':'2'}));
  // Mowing rings
  for(let i=1;i<=5;i++)svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:234-i*14,ry:234-i*14,fill:'none',stroke:i%2?'#206020':'#1d5c1d','stroke-width':'14'}));
  // 30-yard circle
  svg.appendChild(mksvg('ellipse',{cx:250,cy:250,rx:115,ry:115,fill:'none',stroke:'rgba(255,255,255,0.2)','stroke-width':'1.5','stroke-dasharray':'8,5'}));
  // Pitch
  svg.appendChild(mksvg('rect',{x:234,y:174,width:32,height:152,rx:3,fill:'#c8a96e',stroke:'#a88848','stroke-width':'1.5'}));
  // Crease lines
  ['196','312'].forEach(y=>svg.appendChild(mksvg('line',{x1:226,x2:274,y1:y,y2:y,stroke:'rgba(255,255,255,.7)','stroke-width':'1.5'})));
  // Stumps
  [[247,200],[250,200],[253,200],[247,306],[250,306],[253,306]].forEach(([x,y])=>
    svg.appendChild(mksvg('rect',{x:x-1,y:y-10,width:2,height:20,fill:'#f5e6c8',rx:1}))
  );
  // Batting crease marker
  svg.appendChild(mksvg('circle',{cx:250,cy:250,r:4,fill:'#f0dcc0',stroke:'#a88848','stroke-width':'1.5'}));
  // Bowling end label
  svg.appendChild(mksvg('text',{x:250,y:156,'font-size':'9',fill:'rgba(255,255,255,.2)','text-anchor':'middle','font-family':'DM Sans,sans-serif'},'▼ bowling end'));
  // Field position labels (faint guides)
  [
    {t:'Point',x:372,y:256},{t:'Cover',x:348,y:328},{t:'Mid Off',x:306,y:380},
    {t:'Mid On',x:190,y:380},{t:'Mid Wicket',x:154,y:324},{t:'Sq Leg',x:128,y:258},
    {t:'Fine Leg',x:164,y:158},{t:'Third Man',x:348,y:152},
  ].forEach(({t,x,y})=>svg.appendChild(mksvg('text',{x,y,'font-size':'8.5',fill:'rgba(255,255,255,.15)','text-anchor':'middle','font-family':'DM Sans,sans-serif'},t)));
  // Fielder layer
  svg.appendChild(mksvg('g',{id:'fl'}));
  // Events
  svg.addEventListener('mousedown',onMD);
  svg.addEventListener('touchstart',onTS,{passive:false});
}

function renderFielders(){
  const layer=svg.getElementById('fl');if(!layer)return;layer.innerHTML='';
  Object.entries(fielders).forEach(([pid,pos])=>{
    pid=parseInt(pid);
    const p=players.find(x=>x.id===pid);if(!p)return;
    const color=getColor(pid),isSel=selected===pid;
    const g=mksvg('g',{'class':'fielder','data-id':pid,cursor:'grab',transform:`translate(${pos.x},${pos.y})`});
    // Selection ring
    if(isSel)g.appendChild(mksvg('circle',{r:'20',fill:'none',stroke:'#e8c84a','stroke-width':'2','stroke-dasharray':'4,3'}));
    g.appendChild(mksvg('circle',{r:'16',fill:color,stroke:'rgba(0,0,0,.35)','stroke-width':'1.5'}));
    g.appendChild(mksvg('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':'9','font-weight':'500',fill:'rgba(255,255,255,.95)','font-family':'DM Sans,sans-serif'},initials(p.name)));
    const sn=p.name.length>11?p.name.substring(0,10)+'…':p.name;
    g.appendChild(mksvg('text',{'text-anchor':'middle',y:'27','font-size':'8.5',fill:'rgba(255,255,255,.88)','font-family':'DM Sans,sans-serif'},sn));
    layer.appendChild(g);
  });
}

function renderFielderList(){
  const list=document.getElementById('fielder-list');list.innerHTML='';
  const allPos=Object.values(POS);
  players.forEach(p=>{
    const row=document.createElement('div');row.className='fielder-row';
    const fdata=fielders[p.id];
    let posName='— not placed';
    if(fdata){
      // Find nearest named position
      const nearest=allPos.reduce((a,b)=>Math.hypot(a.cx-fdata.x,a.cy-fdata.y)<Math.hypot(b.cx-fdata.x,b.cy-fdata.y)?a:b);
      posName=nearest.name;
    }
    row.innerHTML=`
      <div class="f-dot" style="background:${getColor(p.id)}">${initials(p.name)}</div>
      <span class="f-name">${p.name}</span>
      <span class="f-pos">${posName}</span>
    `;
    list.appendChild(row);
  });
}

// ── DRAG ──────────────────────────────────────────────────────────────────────
function svgPt(e){
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const sx=vb.width/r.width,sy=vb.height/r.height;
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return{x:(cx-r.left)*sx,y:(cy-r.top)*sy};
}
function onMD(e){
  const g=e.target.closest('.fielder');
  if(g){e.preventDefault();startDrag(g,svgPt(e));window.addEventListener('mousemove',onMM);window.addEventListener('mouseup',onMU);}
  else{selected=null;renderFielders();}
}
function onTS(e){const g=e.target.closest('.fielder');if(g){e.preventDefault();startDrag(g,svgPt(e));window.addEventListener('touchmove',onTM,{passive:false});window.addEventListener('touchend',onTE);}}
function startDrag(g,pt){
  dragging=parseInt(g.getAttribute('data-id'));selected=dragging;
  const pos=fielders[dragging];dragOffset={x:pos.x-pt.x,y:pos.y-pt.y};
  renderFielders();setStatus('Moving '+players.find(p=>p.id===dragging)?.name+'…');
}
function onMM(e){if(dragging)moveDrag(svgPt(e));}
function onTM(e){e.preventDefault();if(dragging)moveDrag(svgPt(e));}
function moveDrag(pt){
  if(!dragging)return;
  fielders[dragging]={x:Math.max(14,Math.min(486,pt.x+dragOffset.x)),y:Math.max(14,Math.min(486,pt.y+dragOffset.y))};
  renderFielders();
}
function onMU(){endDrag();window.removeEventListener('mousemove',onMM);window.removeEventListener('mouseup',onMU);}
function onTE(){endDrag();window.removeEventListener('touchmove',onTM);window.removeEventListener('touchend',onTE);}
function endDrag(){
  if(!dragging)return;
  // Snap to nearest named position if within 32px
  const pos=fielders[dragging];
  const allPos=Object.values(POS);
  const snap=allPos.reduce((a,b)=>Math.hypot(a.cx-pos.x,a.cy-pos.y)<Math.hypot(b.cx-pos.x,b.cy-pos.y)?a:b);
  if(Math.hypot(snap.cx-pos.x,snap.cy-pos.y)<32){
    fielders[dragging]={x:snap.cx,y:snap.cy};
    setStatus(players.find(p=>p.id===dragging)?.name+' → '+snap.name);
  } else {
    setStatus(players.find(p=>p.id===dragging)?.name+' moved.');
  }
  dragging=null;save();renderFielders();renderFielderList();
}

// ── SAVE FORMATIONS ───────────────────────────────────────────────────────────
function saveFormation(){
  const name=document.getElementById('save-name').value.trim();
  if(!name){setStatus('Enter a name to save this formation.');return;}
  formations[name]=JSON.parse(JSON.stringify(fielders));
  document.getElementById('save-name').value='';
  save();renderSavedTags();setStatus('"'+name+'" saved.');
}
function loadFormation(name){
  if(!formations[name])return;
  fielders=JSON.parse(JSON.stringify(formations[name]));
  save();renderFielders();renderFielderList();setStatus('"'+name+'" loaded.');
}
function deleteFormation(name){
  delete formations[name];save();renderSavedTags();
}
function renderSavedTags(){
  const wrap=document.getElementById('saved-tags');wrap.innerHTML='';
  Object.keys(formations).forEach(name=>{
    const tag=document.createElement('span');tag.className='saved-tag';
    tag.innerHTML=`${name} <span class="x" onclick="event.stopPropagation();deleteFormation('${name}')">✕</span>`;
    tag.addEventListener('click',()=>loadFormation(name));
    wrap.appendChild(tag);
  });
  if(!Object.keys(formations).length)wrap.innerHTML='<span style="font-size:11px;color:var(--dim);padding:2px 0;">No saved formations yet.</span>';
}

function setStatus(msg){document.getElementById('status-bar').textContent=msg;}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();renderSquad();
</script>
</body>
